            // --- Helper: Format Time ---
            function formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            // --- Helper: Base64 ---
            function toBase64(str) {
                return window.btoa(unescape(encodeURIComponent(str)));
            }
            
            function fromBase64(str) {
                return decodeURIComponent(escape(window.atob(str)));
            }

            // --- Speech Synthesis ---
            function loadVoices() {
                const voices = window.speechSynthesis.getVoices();
                state.voices = voices.filter(v => v.lang.includes('zh') || v.lang.includes('CN') || v.lang.includes('HK') || v.lang.includes('TW'));
                
                ui.voiceSelect.innerHTML = '';
                if (state.voices.length === 0) {
                    const option = document.createElement('option');
                    option.text = "預設中文";
                    ui.voiceSelect.add(option);
                    return;
                }

                state.voices.forEach(voice => {
                    const option = document.createElement('option');
                    option.textContent = `${voice.name} (${voice.lang})`;
                    option.value = voice.voiceURI;
                    ui.voiceSelect.appendChild(option);
                });

                // Restore selection
                if (state.selectedVoiceURI) {
                    ui.voiceSelect.value = state.selectedVoiceURI;
                }
            }

            if (window.speechSynthesis) {
                window.speechSynthesis.onvoiceschanged = loadVoices;
                loadVoices();
            }

            ui.voiceSelect.addEventListener('change', () => {
                state.selectedVoiceURI = ui.voiceSelect.value;
                localStorage.setItem('huayu_book2_voice_uri', state.selectedVoiceURI);
                speakWord('你好'); // Test sound
            });

            function speakWord(text) {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.8; 
                
                if (state.selectedVoiceURI) {
                    const selectedVoice = state.voices.find(v => v.voiceURI === state.selectedVoiceURI);
                    if (selectedVoice) utterance.voice = selectedVoice;
                }

                window.speechSynthesis.speak(utterance);
            }

            // --- Wake Lock Logic ---
            async function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        state.wakeLock = await navigator.wakeLock.request('screen');
                    }
                } catch (err) {
                    console.log(`${err.name}, ${err.message}`);
                }
            }

            function releaseWakeLock() {
                if (state.wakeLock !== null) {
                    state.wakeLock.release()
                        .then(() => { state.wakeLock = null; });
                }
            }

            // Game Logic
            function startTimer() {
                if (state.timerInterval) clearInterval(state.timerInterval);
                
                // If resuming, don't reset startTime
                if (!state.isPaused && state.startTime === 0) {
                    state.startTime = Date.now();
                    state.totalPausedTime = 0;
                } else if (state.isPaused) {
                    // Resume logic
                    state.totalPausedTime += (Date.now() - state.pauseStartTime);
                    state.isPaused = false;
                    ui.btnPause.innerHTML = svgs.pause;
                    ui.grid.classList.remove('paused');
                    ui.pauseModal.classList.remove('show');
                }

                ui.timerDisplay.textContent = formatTime((Date.now() - state.startTime - state.totalPausedTime) / 1000);
                
                state.timerInterval = setInterval(() => {
                    const elapsed = (Date.now() - state.startTime - state.totalPausedTime) / 1000;
                    ui.timerDisplay.textContent = formatTime(elapsed);
                }, 1000);

            function togglePause() {
                if (!state.gameStarted) return; // Can't pause before game starts

                } else {

            function generateBoard(stageConfig) {
                const size = stageConfig.gridSize;
                const board = Array(size).fill(null).map(() => Array(size).fill(''));
                const targets = [];
                let itemsToPlace = [...stageConfig.words].sort(() => 0.5 - Math.random());
                const itemsToPlaceSet = new Set(itemsToPlace);

                for (const item of itemsToPlace) {
                    let placed = false;
                    let attempts = 0;
                    const chars = [...item];
                    while (!placed && attempts < 200) { 
                        attempts++;
                        const direction = stageConfig.directions[Math.floor(Math.random() * stageConfig.directions.length)];
                        const [dr, dc] = direction;
                        const startR = Math.floor(Math.random() * size), startC = Math.floor(Math.random() * size);
                        const endR = startR + dr * (chars.length - 1), endC = startC + dc * (chars.length - 1);
                        if (endR < 0 || endR >= size || endC < 0 || endC >= size) continue;
                        let canPlace = true;
                        for (let i = 0; i < chars.length; i++) {
                            const r = startR + dr * i, c = startC + dc * i;
                            if (board[r][c] !== '' && board[r][c] !== chars[i]) { canPlace = false; break; }
                        }
                        if (canPlace) {
                            for (let i = 0; i < chars.length; i++) board[startR + dr * i][startC + dc * i] = chars[i];
                            targets.push({ word: item, found: false, start: [startR, startC], end: [endR, endC] });
                            placed = true;
                        }
                    }
                }
                let fillerPool = COMMON_CHARS.filter(i => !itemsToPlaceSet.has(i));
                if (!fillerPool || fillerPool.length === 0) fillerPool = ['空'];
                for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (board[r][c] === '') board[r][c] = fillerPool[Math.floor(Math.random() * fillerPool.length)];
                return { board, targets };
            }

            function initGame(stageKey = 'L2_01') {
                state.stage = STAGES[stageKey];
                const data = generateBoard(state.stage);
                state.board = data.board;

            function renderGrid() {
                ui.grid.style.gridTemplateColumns = `repeat(${state.stage.gridSize}, minmax(0, 1fr))`;
                let html = '';
                for (let r = 0; r < state.stage.gridSize; r++) {
                    for (let c = 0; c < state.stage.gridSize; c++) {
                        const isStart = state.firstSelection && state.firstSelection.r === r && state.firstSelection.c === c;
                        let isFound = false;
                        for (const t of state.targets) {
                            if (state.foundWords.includes(t.word)) {
                                const [sr, sc] = t.start;
                                const [er, ec] = t.end;
                                const dr = Math.sign(er - sr);
                                const dc = Math.sign(ec - sc);
                                const len = Math.max(Math.abs(er - sr), Math.abs(ec - sc)) + 1;
                                for(let i=0; i<len; i++) {
                                    if (sr + i*dr === r && sc + i*dc === c) { isFound = true; break; }
                                }
                            }
                            if (isFound) break;
                        }
                        let className = 'cell';
                        if (state.stage.isIconMode) className += ' icon-mode';
                        if (isStart) className += ' active-start';
                        else if (isFound) className += ' found';
                        html += `<div class="${className}" data-r="${r}" data-c="${c}">${state.board[r][c]}</div>`;
                    }
                }
                ui.grid.innerHTML = html;
            }

            function renderTargets() {
                ui.foundCount.textContent = state.foundWords.length;
                ui.totalCount.textContent = state.targets.length;
                const list = ui.targetList;
                list.innerHTML = state.targets.map(t => {

            }

            function handleCellClick(r, c) {
                // Prevent interaction if game hasn't started OR paused
                if (!state.gameStarted || state.isPaused) return; 

                if (!state.firstSelection) {
                    state.firstSelection = { r, c };
                    renderGrid();
                    return;
                }
                const start = state.firstSelection;
                if (start.r === r && start.c === c) {
                    const char = state.board[r][c];
                    const matchedTarget = state.targets.find(t => !state.foundWords.includes(t.word) && t.word === char);
                    if (matchedTarget) {
                        state.foundWords.push(matchedTarget.word);
                        speakWord(matchedTarget.word);
                        checkVictory();
                        state.firstSelection = null;
                    } else {
                        state.firstSelection = null;
                    }
                    renderGrid(); renderTargets(); return;
                }
                
                // Logic for multi-character selection
                const dr = r - start.r;
                const dc = c - start.c;
                const isDiagonal = Math.abs(dr) === Math.abs(dc);
                const isHorizontal = dr === 0;
                const isVertical = dc === 0;

                if (isHorizontal || isVertical || isDiagonal) {
                    const steps = Math.max(Math.abs(dr), Math.abs(dc));
                    const rStep = dr === 0 ? 0 : dr / steps;
                    const cStep = dc === 0 ? 0 : dc / steps;
                    let selectedWord = '';
                    for (let i = 0; i <= steps; i++) {
                        const currR = start.r + i * rStep;
                        const currC = start.c + i * cStep;
                        selectedWord += state.board[currR][currC];
                    }
                    const matchedTarget = state.targets.find(t => 
                        !state.foundWords.includes(t.word) && 
                        (t.word === selectedWord || t.word === [...selectedWord].reverse().join(''))
                    );
                    if (matchedTarget) {
                        state.foundWords.push(matchedTarget.word);
                        speakWord(matchedTarget.word);
                        checkVictory();
                    }
                }
                state.firstSelection = null;
                renderGrid();
                renderTargets();
            }

                if (!text) {

                // Split by newline, comma, and Chinese comma
                const words = text.split(/[\n,、]/).map(w => w.trim()).filter(w => w.length > 0);
                
                if (words.length === 0) {
                    showCustomError('請輸入有效的生詞！');
                    return;
                }

                // Calculate Grid Size dynamicall based on word content
                const totalChars = words.join('').length;
                const longestWord = Math.max(...words.map(w => w.length));
                
                // Base calculation: sqrt(totalChars * 2.5) for enough space
                let calcSize = Math.ceil(Math.sqrt(totalChars * 2.5));
                
                // Determine final size logic
                if (manualSize) {
                    // Manual Mode with validation
                    if (manualSize < longestWord) {
                        // Force upgrade if too small for longest word
                         calcSize = longestWord + 1; // +1 padding
                    } else {
                        calcSize = Math.max(manualSize, 10); // Min 10
                    }
                    // Cap max
                    calcSize = Math.min(25, calcSize);
                } else {
                    // Auto Mode
                    // Ensure grid is at least bigger than the longest word (+2 padding)
                    calcSize = Math.max(11, longestWord + 2, calcSize);
                    // Cap at reasonable max to prevent performance issues on mobile
                    calcSize = Math.min(20, calcSize);

                    display.style.color = '#999';
                };

                // 5. 逾時處理：如果 5 秒後還是 "統計中..."，改為顯示 "服務連線中"
                setTimeout(() => {
                    if (display.textContent === "統計中...") {
                        display.textContent = "服務連線中";
                    }
                }, 5000);

                document.head.appendChild(script);
            };
            
            // --- URL Params Logic (Move here to be sure STAGES is loaded) ---
            loadCustomStages(); // Load saved custom stages

            // Check URL for direct stage or custom data
            const urlParams = new URLSearchParams(window.location.search);
            const queryStage = urlParams.get('stage');
            const customData = urlParams.get('custom');
            
            let startStageId = 'L2_01'; // Default

            if (customData) {
                try {
                    const data = JSON.parse(fromBase64(customData));
                    // Construct temp custom stage
                    const tempId = 'shared_' + Date.now();
                    
                    // Calc size if not provided (backward compatibility)
                    let size = data.s;
                    if (!size) {
                        const words = data.w.split(',');
                         const totalChars = words.join('').length;
                         const longestWord = Math.max(...words.map(w => w.length));
                         size = Math.ceil(Math.sqrt(totalChars * 2.5));
                         size = Math.max(11, longestWord + 2, size);
                         size = Math.min(20, size);
                    }

                    STAGES[tempId] = {
                        id: tempId,
                        name: data.n,
                        description: '分享的自訂課程',
                        gridSize: parseInt(size),
                        directions: [[0, 1], [1, 0], [1, 1]],
                        words: data.w.split(','),
                        targetCount: data.w.split(',').length,
                        brainTip: '自訂挑戰',
                        isCustom: true // Mark as custom but maybe not save to local?
                    };
                    
                    // Add to dropdown
                    const option = document.createElement('option');
                    option.value = tempId;
                    option.text = `★ ${data.n} (分享)`;
                    ui.stageSelect.add(option);
                    
                    startStageId = tempId;

                } catch (e) {
                    console.error("Failed to parse custom data", e);
                    alert("無效的分享連結");
                }
            } else if (queryStage && STAGES[queryStage]) {
                startStageId = queryStage;
            }

            initGame(startStageId);
            initPublicCounter();
        }
        bootstrapGame();
    })();
</script>
</body>
</html>
